# καιρός实验室 / Kairos Lab — Hugo + Stack 配置
# 完整设计文档：思源笔记 Hermes Note → P104_博客系统

baseURL: "https://leekairos.github.io/"
defaultContentLanguage: "zh-cn"
locale: "zh-cn"
title: "καιρός实验室 / Kairos Lab"
theme: "hugo-theme-stack"
hasCJKLanguage: true

# SEO：自动生成 sitemap.xml 和 robots.txt
# sitemap.xml 默认即生成；robots.txt 需要下面这一行
enableRobotsTXT: true

pagination:
  pagerSize: 5

permalinks:
  post: "/p/:slug/"
  page: "/:slug/"

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["\\[", "\\]"], ["$$", "$$"]]
          inline: [["\\(", "\\)"]]
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4

related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: "tags"
      weight: 100
    - name: "categories"
      weight: 200

menu:
  social:
    - identifier: "github"
      name: "GitHub"
      url: "https://github.com/LeeKairos"
      params:
        icon: "brand-github"

# ---------------- 访问量统计：Google Analytics 4 ----------------
# 去 https://analytics.google.com 建账号并创建媒体资源，
# 把衡量 ID（G- 开头）填到下面，部署后即生效。
services:
  googleAnalytics:
    id: ""

params:
  mainSections: ["post"]
  rssFullContent: true

  footer:
    since: 2026
    customText: ""

  dateFormat:
    published: ":date_full"
    lastUpdated: ":date_full"

  sidebar:
    emoji: "⏳"
    subtitle: "在对的时间，做值得做的事。"

  article:
    headingAnchor: false
    math: false
    # 预计阅读时间：显示在每篇文章标题下方
    readingTime: true
    license:
      enabled: true
      default: "Licensed under CC BY-NC-SA 4.0"

  widgets:
    homepage:
      - type: "search"
      - type: "archives"
        params:
          limit: 5
      - type: "categories"
        params:
          limit: 10
      - type: "tag-cloud"
        params:
          limit: 10
    page:
      # 文章目录（TOC）：显示在文章页右侧
      - type: "toc"

  opengraph:
    twitter:
      site: ""
      card: "summary_large_image"

  # 暗黑模式切换：toggle 打开后右上角出现切换按钮，default auto 表示跟随系统
  colorScheme:
    toggle: true
    default: "auto"

  # ---------------- 文章评论系统：Giscus ----------------
  # 接入步骤（详见思源笔记 P104 文章评论系统）：
  # 1. 仓库 Settings → General → Features → 勾选 Discussions
  # 2. 打开 https://giscus.app ，安装 Giscus 应用并授权给 LeeKairos.github.io
  # 3. 在 giscus.app 配好仓库、分类（Announcements）、映射（pathname），复制 repoID 和 categoryID
  # 4. 把下面 enabled 改成 true，并填好 repoID、categoryID
  # 注意：字段名以安装的 Stack 主题版本的 config/_default/params.toml 为准
  comments:
    enabled: false
    provider: "giscus"
    giscus:
      repo: "LeeKairos/LeeKairos.github.io"
      repoID: ""
      category: "Announcements"
      categoryID: ""
      mapping: "pathname"
      lightTheme: "light"
      darkTheme: "dark_dimmed"
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: "top"
      lang: "zh-CN"
      strict: 0
      loading: "lazy"
