<!-- 不蒜子访问量统计（Busuanzi） -->
<!-- 不蒜子是纯前端计数服务，无需注册；数字从 0 开始累计是正常的 -->
<div class="busuanzi-stats" style="text-align: center; font-size: 13px; opacity: 0.75; margin-top: 12px;">
    <span id="busuanzi_container_site_pv">总访问量 <span id="busuanzi_value_site_pv">…</span> 次</span>
    <span style="margin: 0 8px;">·</span>
    <span id="busuanzi_container_site_uv">总访客数 <span id="busuanzi_value_site_uv">…</span> 人</span>
</div>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

<!-- 语言自动识别：仅首次访问首页时，按浏览器语言在中文 / 英文之间跳转；
     一旦访客用语言切换器选过语言，就记住选择，不再自动跳转 -->
<script>
(function () {
    var KEY = 'kairos-lang';
    function currentLang() {
        var p = window.location.pathname;
        if (p === '/en/' || p.indexOf('/en/') === 0) return 'en';
        return 'zh-cn';
    }
    function browserLang() {
        var l = (navigator.language || navigator.userLanguage || '').toLowerCase();
        return l.indexOf('en') === 0 ? 'en' : 'zh-cn';
    }
    // 记住访客在侧边栏语言切换器里的选择
    document.addEventListener('change', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SELECT' && t.closest && t.closest('#i18n-switch')) {
            try {
                var v = t.value || '';
                localStorage.setItem(KEY, (v === '/en/' || v.indexOf('/en/') === 0) ? 'en' : 'zh-cn');
            } catch (err) {}
        }
    });
    try {
        if (localStorage.getItem(KEY)) return;
        var path = window.location.pathname;
        var isHome = path === '/' || path === '/index.html' || path === '/en/' || path === '/en/index.html';
        if (!isHome) return;
        var want = browserLang();
        if (want !== currentLang()) {
            localStorage.setItem(KEY, want);
            window.location.replace(want === 'en' ? '/en/' : '/');
        }
    } catch (e) {}
})();
</script>
